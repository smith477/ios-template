included:
  - App
  - AppTests
  - AppUITests
  - Modules

excluded:
  - Derived
  - Tuist/.build
  - .build

# Tuist writes these into Derived/ on every generate.
disabled_rules:
  - trailing_comma # SwiftFormat owns comma placement.
  - todo # A TODO is a note, not a violation.

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 100

# Test names describe a scenario and are long by design.
identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - to
    - up

nesting:
  type_level: 2

force_unwrapping:
  severity: warning

force_cast: warning
force_try: warning
