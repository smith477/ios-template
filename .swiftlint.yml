included:
  - App
  - AppTests
  - AppUITests
  - Modules

excluded:
  - Derived
  - Tuist/.build
  - .build

# Tuist writes these into Derived/ on every generate.
disabled_rules:
  - trailing_comma # SwiftFormat owns comma placement.
  - todo # A TODO is a note, not a violation.

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

# Size limits stand in for responsibility, since one_declaration_per_file would
# split cohesive code into a pile of tiny files. Under --strict the warning value
# blocks: split the file, or keep it whole with a swiftlint:disable and a reason.
# docs/agents/conventions.md says which.
file_length:
  warning: 300
  error: 450
  ignore_comment_only_lines: true

type_body_length:
  warning: 200
  error: 300

function_body_length:
  warning: 50
  error: 80

# Test names describe a scenario and are long by design.
identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - to
    - up

nesting:
  type_level: 2

# Errors, not warnings: a force unwrap in shipping code is a crash with no
# explanation. Trap deliberately with `fatalError` and say what broke instead.
# The test bundles relax these in their own nested configs.
force_unwrapping:
  severity: error

force_cast: error
force_try: error

# `@unchecked Sendable` asserts thread safety the compiler cannot check, so a
# wrong assertion is a data race Swift 6 no longer catches. Applies to tests too;
# docs/agents/conventions.md lists the provable alternatives.
custom_rules:
  no_unchecked_sendable:
    name: "No @unchecked Sendable"
    regex: '@unchecked\s+Sendable'
    excluded_match_kinds:
      - comment
      - comment.mark
      - comment.url
      - doccomment
      - doccomment.field
      - string
    message: "Make the conformance provable instead: store a Sendable value, or guard state in a Mutex."
    severity: error
  no_history_in_comments:
    name: "No history in comments"
    regex: '(?i)\b(used to|was really|commit [0-9a-f]{7,40})\b'
    match_kinds:
      - comment
      - doccomment
    message: "Comments describe the code as it is now; history belongs in git log and the PR."
    severity: error
