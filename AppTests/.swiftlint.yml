# Inherits the root configuration, force rules included: a test file that needs a
# force unwrap opts out in that file, with its reason.
parent_config: ../.swiftlint.yml

# A nested rule block replaces the root's whole block, so the comment-line setting
# is restated. Type and function body limits come from the root.
file_length:
  warning: 250
  error: 350
  ignore_comment_only_lines: true

# A test file may disable the force rules for the whole file, with its reason; the
# first five are SwiftLint's defaults, restated because this block replaces them.
blanket_disable_command:
  allowed_rules:
    - file_header
    - file_length
    - file_name
    - file_name_no_space
    - single_test_class
    - force_unwrapping
    - force_cast
    - force_try
